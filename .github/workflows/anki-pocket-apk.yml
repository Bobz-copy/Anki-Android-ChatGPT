name: Anki Pocket APK

on:
  workflow_dispatch:
  push:
    branches: [ "anki-pocket-home" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install required Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --update
          echo "Available Android platform packages:"
          "$SDKMANAGER" --list --channel=3 | grep -E "platforms;android-[0-9]+" | head -40 || true
          "$SDKMANAGER" --channel=3 "platform-tools" "build-tools;36.0.0" "platforms;android-37"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build full debug APK
        run: ./gradlew --no-daemon :AnkiDroid:assembleFullDebug

      - name: Find generated APKs
        if: always()
        run: find AnkiDroid/build/outputs/apk -type f -name "*.apk" -print 2>/dev/null || true

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Anki-Pocket-debug
          path: AnkiDroid/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 14
